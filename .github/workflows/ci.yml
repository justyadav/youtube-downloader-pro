name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify modules import and syntax
      run: |
        python -c "import downloader_core; print('downloader_core ok')"
        python -c "import server; print('server ok')"
        python -c "import downloader_cli; print('downloader_cli ok')"

    - name: Test core format builder
      run: |
        python -c "import downloader_core; assert 'bestvideo' in downloader_core.build_format_string('auto', '1080p')['format']"
